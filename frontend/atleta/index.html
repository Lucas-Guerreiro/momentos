<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MOMENTOS • Reels do Atleta</title>
    <meta name="description" content="Assista aos lances arrastando para cima no estilo Instagram Reels.">
    <meta name="theme-color" content="#000000">
    <link rel="stylesheet" href="/atleta/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>

    <div class="insta-app">
        
        <!-- Header Flutuante Superior -->
        <header class="reels-top-header">
            <div class="header-brand">
                <span class="brand-title">MOMENTOS</span>
                <span class="live-dot" title="Ao Vivo"></span>
            </div>

            <!-- Abas Rápidas no Topo (Todos / Hoje / Salvos) -->
            <div class="top-nav-tabs">
                <button class="top-tab active" data-filter="all" id="tab-all">Todos</button>
                <button class="top-tab" data-filter="today" id="tab-today">Hoje</button>
                <button class="top-tab" data-filter="favs" id="tab-favs">Salvos (<span id="top-fav-count">0</span>)</button>
            </div>

            <div class="header-actions">
                <!-- Botão de Áudio Global (Mutado / Com Som) -->
                <button id="btn-global-audio" class="header-icon-btn" title="Ativar / Desativar Som">
                    <svg class="icon-audio-muted" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                        <line x1="23" y1="9" x2="17" y2="15"></line>
                        <line x1="17" y1="9" x2="23" y2="15"></line>
                    </svg>
                    <svg class="icon-audio-on" style="display: none;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                        <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                    </svg>
                </button>

                <!-- Alternar Grade / Reels -->
                <button id="btn-toggle-view" class="header-icon-btn" title="Alternar Grade / Reels">
                    <svg class="icon-grid-view" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                        <rect x="3" y="3" width="7" height="7" rx="1"></rect>
                        <rect x="14" y="3" width="7" height="7" rx="1"></rect>
                        <rect x="14" y="14" width="7" height="7" rx="1"></rect>
                        <rect x="3" y="14" width="7" height="7" rx="1"></rect>
                    </svg>
                    <svg class="icon-reels-view" style="display: none;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                        <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
                        <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
                    </svg>
                </button>
            </div>
        </header>

        <!-- Barra de Stories Flutuante (Filtro por Datas) -->
        <div class="stories-bar" id="stories-bar">
            <div class="stories-scroll" id="stories-container">
                <!-- Stories inseridos dinamicamente -->
            </div>
        </div>

        <!-- Banner Flutuante de Novos Lances (Realtime) -->
        <div id="new-clips-banner" class="floating-realtime-pill" style="display: none;">
            <svg class="ico-fire-pulse" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 23c-4.97 0-9-4.03-9-9 0-3.93 2.53-7.27 6.07-8.49.52-.18 1.05.21 1.05.76v.36c0 .35.21.67.54.8 1.13.45 2.01 1.39 2.41 2.55.22.65 1.07.82 1.52.31.81-.92 1.41-2.02 1.41-3.28 0-.47.45-.82.91-.71C19.78 7.37 21 10.53 21 14c0 4.97-4.03 9-9 9z"/>
            </svg>
            <span>Novo lance na quadra! Toque para ver</span>
        </div>

        <!-- MODO 1: REELS VERTICAL (Arrastar para Cima / TikTok & Instagram Style) -->
        <div class="reels-scroll-container" id="reels-feed">
            <div class="reels-loading-placeholder">
                <div class="loading-spinner"></div>
                <p>Carregando lances da quadra...</p>
            </div>
        </div>

        <!-- MODO 2: GRADE / EXPLORAR (Grade de Miniaturas) -->
        <div class="grid-explore-container" id="grid-explore" style="display: none;">
            <div class="grid-header-meta">
                <span id="grid-count-label">Todos os Lances</span>
            </div>
            <div class="grid-clips-wrap" id="grid-clips-container"></div>
        </div>

        <!-- Bottom Sheet Modal de Velocidades (0.25x até 2.0x) -->
        <div class="speed-sheet-backdrop" id="speed-sheet-backdrop" style="display: none;">
            <div class="speed-sheet">
                <div class="speed-sheet-header">
                    <h3>⚡ Velocidade do Lance (VAR)</h3>
                    <button id="btn-close-speed-sheet">&times;</button>
                </div>
                <div class="speed-options-grid">
                    <button class="speed-opt" data-speed="0.25">0.25x <span class="opt-sub">Super Lenta</span></button>
                    <button class="speed-opt" data-speed="0.5">0.5x <span class="opt-sub">Câmera Lenta</span></button>
                    <button class="speed-opt" data-speed="0.75">0.75x <span class="opt-sub">Quase Normal</span></button>
                    <button class="speed-opt active" data-speed="1.0">1.0x <span class="opt-sub">Normal</span></button>
                    <button class="speed-opt" data-speed="1.25">1.25x <span class="opt-sub">Rápido</span></button>
                    <button class="speed-opt" data-speed="1.5">1.5x <span class="opt-sub">Muito Rápido</span></button>
                    <button class="speed-opt" data-speed="2.0">2.0x <span class="opt-sub">Acelerado 2x</span></button>
                </div>
            </div>
        </div>

        <!-- Toast Flutuante -->
        <div class="floating-toast" id="toast"></div>

    </div>

    <!-- Supabase JS Client (Nuvem & Realtime) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/atleta/js/app.js"></script>
</body>
</html>
