<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MOMENTOS • Portal do Atleta</title>
    <meta name="description" content="Assista, analise em câmera lenta e compartilhe os lances gravados instantaneamente.">
    <meta name="theme-color" content="#070a13">
    <!-- Links Absolutos para garantir carregamento perfeito em /atleta e /atleta/ -->
    <link rel="stylesheet" href="/atleta/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <div class="app-wrapper">
        
        <!-- Header Superior Fixo -->
        <header class="top-nav">
            <div class="nav-brand">
                <div class="logo-box">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <polygon points="5 3 19 12 5 21 5 3"></polygon>
                    </svg>
                </div>
                <div class="logo-text">
                    <span class="logo-name">MOMENTOS</span>
                    <span class="logo-badge">LANCES DA PARTIDA</span>
                </div>
            </div>

            <div class="nav-right">
                <div class="status-pill">
                    <span class="status-dot"></span>
                    <span class="status-txt">AO VIVO</span>
                </div>
                <button id="btn-refresh" class="btn-icon" title="Recarregar lances">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                        <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/>
                    </svg>
                </button>
            </div>
        </header>

        <!-- Banner Flutuante de Novos Lances -->
        <div id="new-clips-banner" class="floating-banner" style="display: none;">
            <div class="banner-inner" id="btn-banner-load">
                <span class="banner-pulse">🔥</span>
                <span>Novos lances disponíveis! Toque para atualizar</span>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                    <polyline points="18 15 12 9 6 15"></polyline>
                </svg>
            </div>
        </div>

        <!-- Área Principal de Conteúdo -->
        <main class="main-container">
            
            <!-- Barra de Busca & Filtros -->
            <section class="filter-bar">
                <div class="search-input-wrapper">
                    <svg class="search-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input type="text" id="input-search" placeholder="Filtrar por horário ou câmera..." autocomplete="off">
                    <button id="btn-clear-search" class="btn-clear" style="display: none;">&times;</button>
                </div>

                <!-- Chips / Pílulas de Câmeras e Favoritos -->
                <div class="chips-scroll" id="filter-chips">
                    <button class="filter-chip active" data-filter="all">Todos os Lances</button>
                    <button class="filter-chip chip-fav" data-filter="favs">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
                        </svg>
                        Favoritos (<span id="fav-count">0</span>)
                    </button>
                </div>
            </section>

            <!-- Título da Seção & Contador -->
            <div class="feed-header">
                <h1 class="feed-title" id="feed-title">Todos os Lances</h1>
                <span class="feed-badge" id="feed-counter">Carregando...</span>
            </div>

            <!-- Feed de Lances Agrupados por Data -->
            <div id="clips-container" class="clips-feed-wrapper">
                <div class="videos-grid">
                    <!-- Skeleton Loading -->
                    <div class="skeleton-card">
                        <div class="skeleton-thumb"></div>
                        <div class="skeleton-body">
                            <div class="skeleton-line" style="width: 60%;"></div>
                            <div class="skeleton-line" style="width: 40%;"></div>
                        </div>
                    </div>
                    <div class="skeleton-card">
                        <div class="skeleton-thumb"></div>
                        <div class="skeleton-body">
                            <div class="skeleton-line" style="width: 60%;"></div>
                            <div class="skeleton-line" style="width: 40%;"></div>
                        </div>
                    </div>
                </div>
            </div>

        </main>

        <!-- Player Modal Especializado para Atletas -->
        <div class="modal-overlay" id="player-modal">
            <div class="modal-backdrop" id="player-backdrop"></div>
            
            <div class="modal-sheet">
                <!-- Cabeçalho do Player -->
                <div class="modal-sheet-header">
                    <div class="modal-title-group">
                        <h2 class="modal-title" id="player-title">Visualizar Lance</h2>
                        <span class="modal-meta" id="player-meta">--:-- • 0 MB</span>
                    </div>
                    <button class="btn-close-modal" id="btn-close-player">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                </div>

                <!-- Video Frame com Toque para Play/Pause -->
                <div class="video-stage">
                    <video id="atleta-video" playsinline preload="auto"></video>
                    
                    <div class="video-tap-area" id="video-touch-overlay">
                        <div class="tap-icon" id="touch-indicator">
                            <svg class="ico-play" viewBox="0 0 24 24" fill="currentColor">
                                <polygon points="5 3 19 12 5 21 5 3"></polygon>
                            </svg>
                        </div>
                    </div>
                </div>

                <!-- Controles do Vídeo -->
                <div class="modal-controls">
                    
                    <!-- Barra de Tempo / Progresso -->
                    <div class="progress-container">
                        <input type="range" id="video-progress" class="progress-bar" min="0" max="1000" value="0">
                        <div class="time-readout">
                            <span id="time-current">00:00.00</span>
                            <span id="time-total">00:00.00</span>
                        </div>
                    </div>

                    <!-- Botões de Controle do Lance (Play, Pulos, Frames) -->
                    <div class="playback-buttons">
                        <button class="btn-control" id="btn-skip-back" title="Voltar 3 segundos">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M1 4v6h6M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>
                            </svg>
                            <span class="btn-subtext">-3s</span>
                        </button>

                        <button class="btn-control" id="btn-frame-prev" title="Frame anterior">
                            <svg viewBox="0 0 24 24" fill="currentColor">
                                <polygon points="19 20 9 12 19 4 19 20"></polygon>
                                <line x1="5" y1="19" x2="5" y2="5" stroke="currentColor" stroke-width="2.5"></line>
                            </svg>
                        </button>

                        <!-- Botão Play/Pause Gigante -->
                        <button class="btn-play-hero" id="btn-play-pause">
                            <svg class="icon-play" viewBox="0 0 24 24" fill="currentColor">
                                <polygon points="6 4 20 12 6 20 6 4"></polygon>
                            </svg>
                            <svg class="icon-pause" viewBox="0 0 24 24" fill="currentColor" style="display: none;">
                                <rect x="6" y="4" width="4" height="16" rx="1"></rect>
                                <rect x="14" y="4" width="4" height="16" rx="1"></rect>
                            </svg>
                        </button>

                        <button class="btn-control" id="btn-frame-next" title="Próximo frame">
                            <svg viewBox="0 0 24 24" fill="currentColor">
                                <polygon points="5 4 15 12 5 20 5 4"></polygon>
                                <line x1="19" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="2.5"></line>
                            </svg>
                        </button>

                        <button class="btn-control" id="btn-skip-forward" title="Avançar 3 segundos">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M23 4v6h-6M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
                            </svg>
                            <span class="btn-subtext">+3s</span>
                        </button>
                    </div>

                    <!-- Seletor de Câmera Lenta / VAR -->
                    <div class="var-bar">
                        <span class="var-label">Câmera Lenta:</span>
                        <div class="var-speeds">
                            <button class="speed-btn" data-speed="0.25">0.25x</button>
                            <button class="speed-btn" data-speed="0.5">0.5x</button>
                            <button class="speed-btn" data-speed="0.75">0.75x</button>
                            <button class="speed-btn active" data-speed="1.0">1x</button>
                            <button class="speed-btn" data-speed="1.5">1.5x</button>
                        </div>
                        <button class="btn-loop active" id="btn-loop-toggle" title="Repetição em Loop">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="17 1 21 5 17 9"></polyline>
                                <path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
                                <polyline points="7 23 3 19 7 15"></polyline>
                                <path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
                            </svg>
                            <span>Loop</span>
                        </button>
                    </div>

                    <!-- Ações: WhatsApp / Compartilhar / Download -->
                    <div class="action-buttons-group">
                        <button class="btn-action btn-share-main" id="btn-share-clip">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                                <circle cx="18" cy="5" r="3"></circle>
                                <circle cx="6" cy="12" r="3"></circle>
                                <circle cx="18" cy="19" r="3"></circle>
                                <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
                                <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
                            </svg>
                            <span>WhatsApp</span>
                        </button>

                        <a id="btn-download-clip" class="btn-action btn-download-main" download>
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                <polyline points="7 10 12 15 17 10"></polyline>
                                <line x1="12" y1="15" x2="12" y2="3"></line>
                            </svg>
                            <span>Baixar</span>
                        </a>

                        <button class="btn-action btn-star-action" id="btn-fav-toggle" title="Favoritar">
                            <svg class="ico-star" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                                <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
                            </svg>
                        </button>
                    </div>

                </div>
            </div>
        </div>

        <!-- Toast Flutuante -->
        <div class="floating-toast" id="toast"></div>

    </div>

    <!-- Supabase JS Client (Nuvem & Realtime) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Script com Caminho Absoluto -->
    <script src="/atleta/js/app.js"></script>
</body>
</html>
